[project]
requires-python = ">=3.12"

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ANN"]
ignore = ["ANN401", "ANN204"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["ANN"]
"proposals/**" = ["ANN"]
"examples/bazel_test_runner.py" = ["ANN"]
"fork/conformance/runner.py" = ["ANN"]
# fork/tools/carbonbuild is the record of the container arbiter's scripts, kept
# byte-identical to the running instance apart from headers and formatter
# output (fork/tools/carbonbuild/README.md), so the findings the formatter
# cannot fix are exempted for it rather than hand-edited.
"fork/tools/carbonbuild/*.py" = ["ANN", "E402", "E501", "E741", "F401", "F841"]
"**/lit.cfg.py" = ["ANN"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.rules]
all = "error"
possibly-unresolved-reference = "ignore"

[tool.ty.src]
exclude = [
    "proposals/p0555/figures.py",
    "proposals/__init__.py",
    "**/lit.cfg.py",
    "examples/bazel_test_runner.py",
    "**/*_test.py",
    # The container arbiter's scripts: see [tool.ruff.lint.per-file-ignores].
    "fork/tools/carbonbuild/",
]

[tool.ty.analysis]
allowed-unresolved-imports = ["rich.**", "requests", "bazel_tools.**"]
