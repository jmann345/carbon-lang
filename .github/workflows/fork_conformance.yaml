#
# Part of jmann345's carbon-lang fork tooling (see /fork/README.md).
#
# Runs the fork conformance suite (fork/conformance/runner.py) on the
# self-hosted runner against a freshly built toolchain from the same tree,
# and commits the regenerated scoreboard back to the branch. This became
# runner-side work when the runner host's glibc moved past the dev
# container's: locally built release tarballs no longer execute there, and
# the scoreboard belongs next to the tree that produced it anyway
# (ORCHESTRATION next-actions: "scoreboard in CI"). The job fails if any
# program FAILs; SKIP/PASS totals are printed for the driving session to
# compare against the recorded floor.

name: 'Fork: conformance suite'

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'fork/conformance-request.txt'

permissions:
  contents: write # For pushing the regenerated scoreboard back to the branch.

jobs:
  conformance:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 720
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure uv
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ensure static LLVM libunwind
        run: |
          set -euo pipefail
          LIBDIR="$HOME/.local/lib/carbon-host-deps"
          mkdir -p "$LIBDIR"
          probe() {
            printf 'int main(){return 0;}' | clang++ -x c++ - -o /tmp/unwind_probe \
              -fuse-ld=lld -stdlib=libc++ -static-libstdc++ -static-libgcc \
              -rtlib=compiler-rt -unwindlib=libunwind -l:libc++abi.a -L"$LIBDIR"
          }
          if ! probe; then
            echo "::error::libunwind.a probe failed; see fork_autoupdate.yaml's provisioning step."
            exit 1
          fi
          echo "build --linkopt=-L$LIBDIR" >> user.bazelrc
          echo "build --host_linkopt=-L$LIBDIR" >> user.bazelrc

      - name: Build toolchain
        run: |
          ./scripts/run_bazel.py build -c opt //toolchain/install:carbon_toolchain_tar

      - name: Run conformance suite
        run: |
          set -euo pipefail
          rm -rf /tmp/conformance-toolchain
          mkdir -p /tmp/conformance-toolchain
          tar xf bazel-bin/toolchain/install/carbon_toolchain-*.tar \
            -C /tmp/conformance-toolchain
          CARBON=$(echo /tmp/conformance-toolchain/carbon_toolchain-*/bin/carbon)
          "$CARBON" version
          python3 fork/conformance/runner.py \
            --toolchain "$CARBON" \
            | tee /tmp/conformance-output.txt
          # Fail loudly on any FAIL-class result. The runner script exits
          # zero as long as it ran; the scoreboard is the verdict.
          python3 - <<'EOF'
          import json
          d = json.load(open('fork/conformance/out/scoreboard.json'))
          totals = d['totals']
          fails = sum(
              totals.get(k, 0)
              for k in ('COMPILE-FAIL', 'LINK-FAIL', 'RUN-FAIL',
                        'OUTPUT-MISMATCH', 'DIFF-MISMATCH'))
          print('totals:', totals)
          if fails:
              raise SystemExit(f'{fails} conformance failure(s)')
          EOF

      - name: Print failure logs
        if: failure()
        run: |
          # Diagnostic-only: the per-program failure logs (compiler stderr,
          # both stdouts of a DIFF-MISMATCH) otherwise exist only on the
          # runner's disk. Printing them changes no pass/fail semantics.
          for f in fork/conformance/out/logs/*; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            sed -n '1,200p' "$f"
          done

      - name: Dump failing-program LLVM IR
        if: failure()
        run: |
          # Diagnostic-only: three golden shapes have failed to reproduce
          # the question_generic_diff runtime divergence, so the mechanism
          # must be read off the REAL compile's IR. Bounded output: defines
          # and call sites of the propagation chain's symbols only.
          set +e
          CARBON=$(echo /tmp/conformance-toolchain/carbon_toolchain-*/bin/carbon)
          PROG=fork/conformance/programs/error_handling/question_generic_diff.carbon
          [ -x "$CARBON" ] && [ -f "$PROG" ] || exit 0
          "$CARBON" compile --phase=lower --dump-llvm-ir "$PROG" \
            > /tmp/qgd.ll 2> /tmp/qgd.err
          echo "===== compile stderr (first 40) ====="
          sed -n '1,40p' /tmp/qgd.err
          echo "===== IR symbol inventory ====="
          grep -E "^(define|declare)" /tmp/qgd.ll | grep -vE "llvm\.|Destroy" | sed -n '1,80p'
          echo "===== chain bodies ====="
          awk '/^define.*(Chain|Step|FromBreak|Branch|Err\.MyResult|Ok\.MyResult|Break\.ControlFlow|Continue\.ControlFlow)/, /^}/' /tmp/qgd.ll | sed -n '1,400p'

      - name: Optimization-level bisect
        if: failure()
        run: |
          # Diagnostic-only: the lowered IR is per-width correct, so the
          # divergence must enter during LLVM optimization/codegen or link
          # (lifetime.start has no matching end — an upstream lowering TODO,
          # function_context.cpp — making optimizer-exploited stack-slot UB
          # the live suspect). Runs the failing pair at each --optimize
          # level; the level where output goes wrong localizes the stage.
          set +e
          CARBON=$(echo /tmp/conformance-toolchain/carbon_toolchain-*/bin/carbon)
          PROG=fork/conformance/programs/error_handling/question_generic_diff.carbon
          [ -x "$CARBON" ] && [ -f "$PROG" ] || exit 0
          for LVL in none debug speed default; do
            if [ "$LVL" = default ]; then OPTARG=""; else OPTARG="--optimize=$LVL"; fi
            "$CARBON" compile $OPTARG --output=/tmp/qgd_$LVL.o \
              --output-last-input-only "$PROG" 2>/dev/null \
            && "$CARBON" link --output=/tmp/qgd_$LVL /tmp/qgd_$LVL.o 2>/dev/null \
            && OUT=$(timeout 30 /tmp/qgd_$LVL; echo "exit=$?")
            echo "===== --optimize=$LVL ====="
            echo "$OUT" | tr '\n' ' '
            echo
          done

      - name: Lifetime-strip experiment
        if: failure()
        run: |
          # Diagnostic-only, the UB-source proof: --optimize=none is correct
          # and every optimizing level corrupts (level-dependently), so the
          # UNOPTIMIZED IR is semantically right and carries something the
          # optimizer is entitled to exploit. Candidate: lifetime.start with
          # no matching end (upstream TODO, lower/function_context.cpp).
          # Compile the same unoptimized IR twice with the bundled clang at
          # -O1 — verbatim, and with every llvm.lifetime call stripped. If
          # stripped is correct and verbatim is wrong, the markers are the
          # proven UB source.
          set +e
          TC=$(echo /tmp/conformance-toolchain/carbon_toolchain-*)
          CARBON="$TC/bin/carbon"
          CLANGXX="$TC/lib/carbon/llvm/bin/clang++"
          PROG=fork/conformance/programs/error_handling/question_generic_diff.carbon
          [ -x "$CARBON" ] && [ -x "$CLANGXX" ] || exit 0
          "$CARBON" compile --phase=lower --dump-llvm-ir "$PROG" \
            > /tmp/qgd0.ll 2>/dev/null
          grep -v "call void @llvm.lifetime" /tmp/qgd0.ll > /tmp/qgd0_stripped.ll
          for VAR in qgd0 qgd0_stripped; do
            "$CLANGXX" -Wno-override-module -O1 /tmp/$VAR.ll -o /tmp/${VAR}_bin \
              2>/tmp/${VAR}_cc.err
            if [ -x /tmp/${VAR}_bin ]; then
              OUT=$(timeout 30 /tmp/${VAR}_bin; echo "exit=$?")
            else
              OUT="compile failed: $(head -3 /tmp/${VAR}_cc.err | tr '\n' ' ')"
            fi
            echo "===== $VAR -O1 ====="
            echo "$OUT" | tr '\n' ' '
            echo
          done
          echo "===== post-opt IR (optimize=debug): ProbeL + wide Chain ====="
          "$CARBON" compile --optimize=debug --dump-llvm-ir "$PROG" \
            > /tmp/qgd_opt.ll 2>/dev/null
          awk '/^define.*(_CProbeL|_CChain.Main.f249b435)/, /^}/' /tmp/qgd_opt.ll | sed -n '1,220p'

      - name: Commit and push scoreboard
        run: |
          set -euo pipefail
          git config user.name 'jmann345'
          git config user.email 'jerrymannstan@gmail.com'
          git add -f -- fork/conformance/out/scoreboard.json
          if git diff --cached --quiet; then
            echo "Scoreboard unchanged; nothing to commit."
            exit 0
          fi
          git commit \
            -m "Regenerate the conformance scoreboard on the self-hosted runner" \
            -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
