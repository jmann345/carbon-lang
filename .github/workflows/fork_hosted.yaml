#
# Part of jmann345's carbon-lang fork tooling (see /fork/README.md).
#
# Fork verification on GitHub-hosted runners (fork/rulebook.md R28: the
# self-hosted runner is the owner's own machine and is not used). Reuses
# upstream's build-setup action so bazel reads upstream's public remote cache
# with matching keys; never uploads to it. Modes:
#   compile    — build the compiler binary (feasibility/timing probe).
#   autoupdate — refill testdata goldens and push them to the dispatched ref.
#   gate       — prek + `bazel test //toolchain/...` (the R21 merge gate).
#   conformance — build the toolchain tarball, run fork/conformance/runner.py,
#                 push the regenerated scoreboard to the dispatched ref.

name: 'Fork: hosted verification'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'compile | autoupdate | gate | conformance'
        required: true
        default: 'compile'
        type: choice
        options: [compile, autoupdate, gate, conformance]

permissions:
  contents: write # autoupdate/conformance push results back to the dispatched ref.

concurrency:
  group: fork-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Build setup (upstream action, read-only remote cache)
        uses: ./.github/actions/build-setup-common
        with:
          matrix_runner: ubuntu-22.04
          remote_cache_upload: '--noremote_upload_local_results'

      - name: Compile the toolchain binary
        if: inputs.mode == 'compile'
        run: |
          set -euo pipefail
          time ./scripts/run_bazel.py build -c opt //toolchain:carbon

      - name: Autoupdate testdata
        if: inputs.mode == 'autoupdate'
        run: |
          set -euo pipefail
          time python3 ./toolchain/autoupdate_testdata.py

      - name: Commit and push testdata changes
        if: inputs.mode == 'autoupdate'
        run: |
          set -euo pipefail
          git config user.name 'jmann345'
          git config user.email 'jerrymannstan@gmail.com'
          git add -- ':(glob)toolchain/**/testdata/**'
          if git diff --cached --quiet; then
            echo "No testdata changes; nothing to commit."
            exit 0
          fi
          git commit \
            -m "Autoupdate testdata goldens on a GitHub-hosted runner" \
            -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_018tx3BJWJhp2yYjHPRA5fNR"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: prek (lint/format acceptance)
        if: inputs.mode == 'gate'
        # The build-setup action writes an untracked user.bazelrc into the
        # workspace; keep it out of the copyright check, then restore it for
        # the bazel test step.
        run: |
          set -euo pipefail
          mv user.bazelrc "$RUNNER_TEMP/user.bazelrc"
          uvx prek run --all-files
          mv "$RUNNER_TEMP/user.bazelrc" user.bazelrc

      - name: Test the toolchain
        if: inputs.mode == 'gate'
        run: |
          set -euo pipefail
          time ./scripts/run_bazel.py test //toolchain/...

      - name: Build the toolchain tarball
        if: inputs.mode == 'conformance'
        run: |
          set -euo pipefail
          time ./scripts/run_bazel.py build -c opt //toolchain/install:carbon_toolchain_tar

      - name: Run the conformance suite
        if: inputs.mode == 'conformance'
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/conformance-toolchain"
          rm -rf "$DEST" && mkdir -p "$DEST"
          tar xf bazel-bin/toolchain/install/carbon_toolchain-*.tar -C "$DEST"
          CARBON=$(echo "$DEST"/carbon_toolchain-*/bin/carbon)
          "$CARBON" version
          python3 fork/conformance/runner.py --toolchain "$CARBON" \
            | tee "$RUNNER_TEMP/conformance-output.txt"
          python3 - <<'EOF'
          import json
          d = json.load(open('fork/conformance/out/scoreboard.json'))
          totals = d['totals']
          fails = sum(
              totals.get(k, 0)
              for k in ('COMPILE-FAIL', 'LINK-FAIL', 'RUN-FAIL',
                        'OUTPUT-MISMATCH', 'DIFF-MISMATCH'))
          print('totals:', totals)
          if fails:
              raise SystemExit(f'{fails} conformance failure(s)')
          EOF

      - name: Print conformance failure logs
        if: inputs.mode == 'conformance' && failure()
        run: |
          for f in fork/conformance/out/logs/*; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            sed -n '1,200p' "$f"
          done

      - name: Commit and push the scoreboard
        if: inputs.mode == 'conformance'
        run: |
          set -euo pipefail
          git config user.name 'jmann345'
          git config user.email 'jerrymannstan@gmail.com'
          # The out/ directory is gitignored; the scoreboard itself is tracked.
          git add -f fork/conformance/out/scoreboard.json
          if git diff --cached --quiet; then
            echo "Scoreboard unchanged; nothing to commit."
            exit 0
          fi
          git commit \
            -m "Regenerate the conformance scoreboard on a GitHub-hosted runner" \
            -m "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_018tx3BJWJhp2yYjHPRA5fNR"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
